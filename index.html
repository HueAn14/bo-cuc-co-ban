<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Tạo Bố Cục Cơ Bản</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Khung bao toàn bộ trang web -->
    <div id="main">
        
        <!-- Phân vùng Header (Logo & Banner) -->
        <div id="head">
            <h1>LOGO & BANNER</h1>
        </div>

        <!-- Phân vùng Liên kết đầu trang -->
        <div id="head-link">
            <a href="#">Home</a> | 
            <a href="#">Students</a> | 
            <a href="#">Course</a> | 
            <a href="#">About Us</a>
        </div>

        <!-- Phân vùng Cột Trái -->
        <div id="left">
            <h3>Menu Trái</h3>
            <ul>
                <li><a href="#">Liên kết 1</a></li>
                <li><a href="#">Liên kết 2</a></li>
                <li><a href="#">Liên kết 3</a></li>
            </ul>
        </div>

        <!-- Phân vùng Nội dung chính -->
        <div id="content">
            <h2>Nội dung chính (Content)</h2>
            <p>Hot news, Photo Slide, News 1, v.v.</p>
        </div>

        <!-- Phân vùng Cột Phải -->
        <div id="right">
            <h3>Cột Phải</h3>
            <p>Lịch, biểu đồ, bản đồ...</p>
        </div>

        <!-- Phân vùng Footer (Cuối trang) -->
        <div id="footer">
            <p>&copy; Thông tin chủ sở hữu & các liên kết cuối trang</p>
        </div>

    </div>

</body>
</html>
